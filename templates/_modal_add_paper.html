{# _modal_add_paper.html — included in dashboard and papers pages #}
<div class="modal-ov" id="add-modal">
  <div class="modal" style="max-width:700px">
    <div class="modal-hdr">
      <h2 class="modal-title">Add New Paper</h2>
      <button class="modal-x close-modal" onclick="closeModal('add-modal')">×</button>
    </div>
    <form action="{{ url_for('paper_create') }}" method="POST">
      <div class="modal-body">
        <div class="fg">
          <label class="fl">Paper Title <span class="req">*</span></label>
          <input class="fi" name="title" type="text" placeholder="Enter the full paper title…" required autofocus>
        </div>
        <div class="fg2">
          <div class="fg">
            <label class="fl">Authors</label>
            <input class="fi" name="authors" type="text" placeholder="Your Name, Co-author Name…">
          </div>
          <div class="fg">
            <label class="fl">Journal Target</label>
            <input class="fi" name="journal" type="text" placeholder="e.g. Chemical Engineering J.">
          </div>
        </div>
        <div class="fg2">
          <div class="fg">
            <label class="fl">Journal Type</label>
            <select class="fs" name="journal_type">
              <option value="">— Select —</option>
              {% for jt in journal_types %}<option value="{{ jt }}">{{ jt }}</option>{% endfor %}
            </select>
          </div>
          <div class="fg">
            <label class="fl">Priority</label>
            <select class="fs" name="priority">
              {% for pid,plbl in priorities %}<option value="{{ pid }}" {% if pid=='medium' %}selected{% endif %}>{{ plbl }}</option>{% endfor %}
            </select>
          </div>
        </div>
        <div class="fg2">
          <div class="fg">
            <label class="fl">Stage</label>
            <select class="fs" name="stage">
              {% for s in stages %}<option value="{{ s.id }}">{{ s.icon }} {{ s.label }}</option>{% endfor %}
            </select>
          </div>
          <div class="fg">
            <label class="fl">Progress: <span id="add-prog-lbl" style="color:var(--indigo)">0%</span></label>
            <input type="range" name="progress" min="0" max="100" value="0" step="5" data-lbl="add-prog-lbl">
          </div>
        </div>
        <div class="fg2">
          <div class="fg">
            <label class="fl">Start Date</label>
            <input class="fi" name="start_date" type="date" value="{{ today }}">
          </div>
          <div class="fg">
            <label class="fl">Target Submission</label>
            <input class="fi" name="target_date" type="date">
          </div>
        </div>
        <div class="fg">
          <label class="fl">Keywords</label>
          <input class="fi" name="keywords" type="text" placeholder="battery recycling, hydrometallurgy, NMC…">
        </div>
        <div class="fg">
          <label class="fl">Abstract</label>
          <textarea class="ft" name="abstract" placeholder="Paste your abstract draft here…" style="min-height:70px"></textarea>
        </div>
        <div class="fg" style="margin-bottom:0">
          <label class="fl">Notes</label>
          <textarea class="ft" name="notes" placeholder="Ideas, references, to-do items…" style="min-height:65px"></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost close-modal" onclick="closeModal('add-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Paper</button>
      </div>
    </form>
  </div>
</div>
